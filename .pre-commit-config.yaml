# .pre-commit-config.yaml — Unifideck
#
# Run `pre-commit install` once, then every `git commit` runs
# these hooks on changed files. Aligned with pyproject.toml.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: end-of-file-fixer
        exclude: ^fiche_sources/
      - id: trailing-whitespace
        exclude: ^fiche_sources/
      - id: mixed-line-ending
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
        args: [--fix, --config, pyproject.toml]
        exclude: ^fiche_sources/
      - id: ruff-format
        exclude: ^fiche_sources/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        files: ^py_modules/unifideck/(core|event_bus)/
        additional_dependencies:
          - types-PyYAML
          - types-requests
        args: [--config-file, pyproject.toml]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        args: [-c, pyproject.toml]
        additional_dependencies: ["bandit[toml]"]
        files: ^(py_modules/|main\.py$)

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.0
    hooks:
      - id: gitleaks

  # i18n gates. Local hooks (no external repo) because they are
  # repo-specific scripts. `pass_filenames: false` — each script
  # scans the whole tree itself, comparing every locale against
  # en-US, so a per-file invocation would be meaningless.
  - repo: local
    hooks:
      - id: check-orphan-keys
        name: i18n — keys used in code exist in every locale
        entry: python3 scripts/check_orphan_keys.py
        language: system
        pass_filenames: false
        files: ^(src/.*\.(ts|tsx)|src/i18n/locales/.*\.json)$

      - id: check-untranslated
        name: i18n — translations are translated, placeholders match
        entry: python3 scripts/check_untranslated.py
        language: system
        pass_filenames: false
        files: ^(src/i18n/locales/.*\.json|scripts/i18n_allowlist\.json)$

      - id: check-hardcoded-strings
        name: i18n — no hardcoded user-facing strings in toasts
        entry: python3 scripts/check_hardcoded_strings.py
        language: system
        pass_filenames: false
        files: ^(src/.*\.(ts|tsx)|py_modules/unifideck/.*\.py)$

      - id: check-config-keys
        name: config — every unguarded config.get key is registered
        entry: python3 scripts/check_config_keys.py
        language: system
        pass_filenames: false
        files: ^py_modules/unifideck/.*\.py$

ci:
  autofix_commit_msg: "style: pre-commit autofixes"
  autoupdate_schedule: monthly
